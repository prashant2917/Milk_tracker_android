name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 4️⃣ Permissions
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5️⃣ Decode Keystore
      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      # 6️⃣ Build
      - name: Build Project
        run: ./gradlew clean build

      # 7️⃣ Unit Tests
      - name: Run Tests
        run: ./gradlew test

      # 8️⃣ Lint
      - name: Run Lint
        run: ./gradlew lint

      # 9️⃣ Assemble Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 🔟 Assemble Release APK (Signed)
      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # 1️⃣1️⃣ Create Output Folders
      - name: Prepare Output Folders
        run: |
          mkdir -p app/debug
          mkdir -p app/release

      # 1️⃣2️⃣ Move Debug APK
      - name: Move Debug APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/debug/

      # 1️⃣3️⃣ Move Release APK
      - name: Move Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk app/release/

      # 1️⃣4️⃣ Upload Artifacts
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MilkTracker-APKs
          path: |
            app/debug/app-debug.apk
            app/release/app-release.apk