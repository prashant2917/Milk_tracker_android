name: Manual Release Build

on:
  workflow_dispatch:

jobs:
  release:

    runs-on: ubuntu-latest

    steps:

      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # Permission
      - name: Grant permission
        run: chmod +x gradlew

      # Decode keystore
      - name: Decode Keystore
        run: |
          mkdir -p app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      # Build Release APK
      - name: Build Signed Release APK and AAB
        run: |
          ./gradlew assembleRelease bundleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/app/keystore.jks \
          -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      # Move APK and AAB
      - name: Prepare output
        run: |
          mkdir -p app/release
          cp app/build/outputs/apk/release/app-release.apk app/release/
          cp app/build/outputs/bundle/release/app-release.aab app/release/

      # Upload
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MilkTracker-Release
          path: app/release/
